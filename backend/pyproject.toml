[project]
name = "aria-secretary-backend"
version = "0.1.0"
description = "Aria 私人秘書 — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.69",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ---- Ruff:lint + format（取代 black / isort / flake8）----
[tool.ruff]
target-version = "py311"
# 放寬到 120:超標者皆為中文註解/字串,程式碼本身仍由 format 收斂
line-length = 120

[tool.ruff.lint]
# E/W=pycodestyle, F=pyflakes, I=isort, UP=pyupgrade, B=bugbear, C4=comprehensions
select = ["E", "W", "F", "I", "UP", "B", "C4"]
# UP042:(str, Enum) 為合法慣用寫法,改 StrEnum 對 SQLAlchemy/Pydantic 有序列化行為變動風險,故豁免
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 慣用 Depends()/Query()/... 當參數預設值,B008 對此為誤報,列入豁免
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.format]
quote-style = "double"

# ---- bandit:Python 程式碼安全掃描 ----
[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
